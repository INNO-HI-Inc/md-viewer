  .markdown-body .md-block[data-shot-hover] { background: color-mix(in srgb, var(--md-accent) 4%, transparent); }
  .markdown-body td[data-shot-hover] > .md-edit-icon,
  .markdown-body .md-block[data-shot-hover] > .md-edit-icon { opacity: 1 !important; transform: scale(1) !important; }

var MD = `# 📝 회의록 — Q3 제품 전략

## 🧮 단가 모델

월 사용료를 \\(p\\), 사용자 수를 \\(u\\), 이탈률을 \\(c\\)라 할 때 LTV는:

$$\\text{LTV} = \\frac{p \\cdot u}{c} \\cdot (1 + \\alpha \\sqrt{t})$$

여기서 \\(\\alpha\\)는 성장 가속도, \\(t\\)는 가입 후 경과 개월입니다.

## 💡 가설 검증 실험

initEditor(MD, '회의록.md', '', {
    defaultTheme: 'blue',
    defaultFontSize: 16,
    defaultMode: 'preview',
    showOutline: true
});

function blockByText(txt) {
    var blocks = document.querySelectorAll('#preview .md-block');
    for (var i = 0; i < blocks.length; i++) {
        if ((blocks[i].textContent || '').indexOf(txt) >= 0) return blocks[i];
    }
    return null;
}

// Marketing controls
window.__mkt = {
    setTheme: function (name) { if (typeof applyTheme === 'function') applyTheme(name); },
    setMode: function (m) { setMode(m); },
    setTitle: function (t) { var e = document.getElementById('mac-title'); if (e) e.textContent = t; },
    setOutline: function (visible) {
        if (outlineEl) {
            outlineEl.classList.toggle('hidden', !visible);
            var btn = document.querySelector('.outline-toggle');
            if (btn) btn.classList.toggle('active', visible);
        }
    },
    openLightbox: function (src, alt) { openLightbox(src, alt); },
    openPdfDialog: function () { showPdfOptionsDialog(function () {}); },
    openPreviewSearch: function (q) {
        openPreviewSearch();
        if (q) {
            var i = document.querySelector('.preview-search-panel .ps-input');
            i.value = q;
            i.dispatchEvent(new Event('input', { bubbles: true }));
        }
    },
    scrollTo: function (frac) {
        var p = document.querySelector('.preview-pane');
        if (p) p.scrollTo({ top: p.scrollHeight * frac });
    },
    scrollTop: function () {
        var p = document.querySelector('.preview-pane'); if (p) p.scrollTo({ top: 0 });
    },
    closeOverlays: function () {
        closeLightbox(); closePreviewSearch();
        if (typeof closeBlockPopup === 'function') closeBlockPopup();
        var d = document.querySelector('.pdf-options-dialog');
        if (d && d.parentNode) d.parentNode.removeChild(d);
        document.querySelectorAll('[data-shot-hover]').forEach(function (n) { n.removeAttribute('data-shot-hover'); });
    },
    setVscodeTheme: function (t) {
        document.body.classList.remove('vscode-light', 'vscode-dark', 'vscode-high-contrast');
        document.body.classList.add(t);
        // editor.css derives --md-bg/--md-text from VS Code's injected
        // --vscode-* vars, which don't exist outside VS Code. Provide
        // realistic values so dark mode actually renders dark (default VS
        // Code dark: editor bg #1e1e1e / fg #d4d4d4).
        // --md-bg is declared on :root, so the --vscode-* vars must live on
        // :root (documentElement) too — setting them on <body> wouldn't be
        // visible to the :root var() lookup.
        var s = document.documentElement.style;
        if (t === 'vscode-dark') {
            s.setProperty('--vscode-editor-background', '#1e1e1e');
            s.setProperty('--vscode-editor-foreground', '#d4d4d4');
            s.setProperty('--vscode-panel-border', '#2b2b2b');
        } else {
            s.removeProperty('--vscode-editor-background');
            s.removeProperty('--vscode-editor-foreground');
            s.removeProperty('--vscode-panel-border');
        }
    },
    // Scroll a block to the vertical middle so its gutter handles + any
    // anchored menu sit fully in view (not clipped under the toolbar).
    centerBlock: function (txt) {
        var b = blockByText(txt);
        if (b) b.scrollIntoView({ block: 'center' });
        return !!b;
    },
    // Reveal the ＋ ⠿ ✎ handles on the block containing `txt`
    showHandles: function (txt) {
        var b = blockByText(txt);
        if (!b) return false;
        b.scrollIntoView({ block: 'center' });
        b.setAttribute('data-shot-hover', '1');
        return true;
    },
    // Open the insert (＋) menu anchored to that block's add handle
    openInsertMenu: function (txt) {
        var b = blockByText(txt);
        if (!b) return false;
        b.scrollIntoView({ block: 'center' });
        b.setAttribute('data-shot-hover', '1');
        var idx = parseInt(b.dataset.blockIdx, 10);
        var btn = b.querySelector('.md-handle-add');
        if (typeof openBlockPopup === 'function' && btn) { openBlockPopup('insert', idx, btn); return true; }
        return false;
    },
    // Put a paragraph block into in-place WYSIWYG edit state
    editBlock: function (txt) {
        var b = blockByText(txt);
        if (b && typeof openBlockEditor === 'function') { openBlockEditor(b); return true; }
        return false;
    }
};
