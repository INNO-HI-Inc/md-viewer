name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level env so VSCE_PAT is visible to step `if:` expressions.
    # A step's own env: block isn't evaluated before its if: — that's why earlier
    # releases never auto-published even with the secret set.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install vsce and ovsx
        run: npm install -g @vscode/vsce ovsx

      - name: Package VSIX
        run: vsce package

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with VSIX
        uses: softprops/action-gh-release@v1
        with:
          files: "*.vsix"
          name: "MD Pretty Viewer v${{ steps.version.outputs.version }}"
          body: |
            See [CHANGELOG.md](https://github.com/INNO-HI-Inc/md-viewer/blob/main/CHANGELOG.md) for changes.

            ## Install
            ```bash
            code --install-extension innohi.md-pretty-viewer
            ```

      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: vsce publish --no-git-tag-version -p "$VSCE_PAT"

      # Open VSX = Cursor · Windsurf · VSCodium · Gitpod · Theia 내장 마켓.
      # 최초 1회 네임스페이스 생성이 필요: `npx ovsx create-namespace innohi -p $OVSX_PAT`
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        run: ovsx publish "md-pretty-viewer-${{ steps.version.outputs.version }}.vsix" -p "$OVSX_PAT"
